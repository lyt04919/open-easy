<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open-Easy 开发者工作台 (OrbStack 自愈版)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes launch-wave-light {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6); }
      70% { box-shadow: 0 0 0 12px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
    .launching-wave-light {
      animation: launch-wave-light 1.4s cubic-bezier(0.24, 0, 0.38, 1) infinite;
    }
    .squircle {
      border-radius: 22.5%;
    }
    .app-icon {
      transition: all 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .app-icon:hover {
      transform: translateY(-3px) scale(1.04);
    }
    .app-icon:active {
      transform: translateY(1px) scale(0.92);
    }
    .icon-gloss-light {
      box-shadow: inset 0 1px 1.5px 0 rgba(255, 255, 255, 0.7), 
                  0 10px 24px -4px rgba(0, 0, 0, 0.12), 
                  0 3px 8px -1px rgba(0, 0, 0, 0.06);
    }
    .led-green-light {
      box-shadow: 0 0 6px #10b981;
    }
    .led-amber-light {
      box-shadow: 0 0 6px #f59e0b;
    }
    @keyframes hud-in {
      from { opacity: 0; transform: translate(-50%, 16px) scale(0.96); }
      to { opacity: 1; transform: translate(-50%, 0) scale(1); }
    }
    .hud-float {
      animation: hud-in 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes modal-pop {
      from { opacity: 0; transform: scale(0.93) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .modal-animate {
      animation: modal-pop 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="bg-[#e7e7eb] text-zinc-800 antialiased p-8 flex flex-col items-center justify-center min-h-screen select-none font-sans" onclick="handleGlobalClick(event)">

  <!-- macOS Native Window Container (780 x 540) - Clean Studio Light Edition -->
  <div class="relative w-full max-w-[780px] h-[540px] bg-[#fbfbfd]/95 border border-black/10 rounded-2xl shadow-[0_20px_60px_-15px_rgba(0,0,0,0.18)] backdrop-blur-2xl overflow-hidden flex flex-col">
    
    <!-- Titlebar - Authentic macOS Light Header -->
    <div class="h-11 bg-[#f0f0f3]/90 border-b border-black/[0.08] px-4 flex items-center justify-between select-none">
      <div class="flex items-center space-x-2">
        <div class="w-3 h-3 rounded-full bg-[#ff5f56] border border-[#e0443e]"></div>
        <div class="w-3 h-3 rounded-full bg-[#ffbd2e] border border-[#dea123]"></div>
        <div class="w-3 h-3 rounded-full bg-[#27c93f] border border-[#1aab29]"></div>
        <span class="ml-4 text-xs font-semibold tracking-wide text-zinc-600">Open-Easy 开发者工作台</span>
      </div>

      <!-- Center Search Capsule -->
      <div class="relative w-64">
        <input 
          id="searchInput"
          type="text" 
          placeholder="搜索项目、技术栈或端口..." 
          class="w-full pl-8 pr-3 py-1 bg-white/90 border border-black/10 rounded-full text-xs text-zinc-700 placeholder-zinc-400 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500/20 transition-all text-center focus:text-left font-normal shadow-xs"
          oninput="handleSearch(this.value)"
        />
        <svg class="w-3.5 h-3.5 text-zinc-400 absolute left-3 top-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
      </div>

      <!-- Header Quick Actions -->
      <div class="flex items-center space-x-2">
        <!-- Global Sleep / Free Memory Button -->
        <button onclick="sleepAllContainers()" title="一键休眠所有容器与 OrbStack 引擎，实现 0% 内存消耗" class="px-2.5 py-1 bg-amber-50 hover:bg-amber-100 border border-amber-200/80 text-amber-800 rounded-full text-[11px] font-medium transition-all shadow-xs flex items-center space-x-1">
          <span>🌙</span>
          <span>一键休眠</span>
        </button>

        <!-- OrbStack Auto-Healing Indicator -->
        <div id="orbHeaderStatus" onclick="toggleOrbStatusForDemo()" title="点击模拟 OrbStack 开启/待机切换" class="cursor-pointer flex items-center space-x-1.5 px-2.5 py-1 bg-emerald-50 border border-emerald-200/80 rounded-full shadow-xs transition-colors">
          <span id="orbLed" class="w-1.5 h-1.5 rounded-full bg-emerald-500 led-green-light"></span>
          <span id="orbStatusText" class="text-[11px] text-emerald-700 font-medium">OrbStack 正常</span>
        </div>
      </div>
    </div>

    <!-- Launchpad Grid Body -->
    <div class="flex-1 p-7 overflow-y-auto">
      <div class="mb-5 px-2 flex items-center justify-between text-[11px] text-zinc-500 font-medium">
        <div class="flex items-center space-x-2">
          <span class="uppercase tracking-wider text-[10px] font-semibold text-zinc-400">已接入的 Compose 项目</span>
          <span class="text-zinc-300">|</span>
          <span class="text-zinc-500 text-[11px] font-normal">点击任意图标查看详情面板 · 支持引擎自愈与一键直达</span>
        </div>
        <div class="flex items-center space-x-3 text-zinc-400 text-[10px]">
          <span class="flex items-center space-x-1"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span><span>运行中</span></span>
          <span class="flex items-center space-x-1"><span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span><span>端口占用</span></span>
          <span class="flex items-center space-x-1"><span class="w-1.5 h-1.5 rounded-full bg-zinc-300"></span><span>已休眠</span></span>
        </div>
      </div>

      <!-- 4 Columns Grid -->
      <div id="appsGrid" class="grid grid-cols-4 gap-y-7 gap-x-4 justify-items-center">
        <!-- Injected via JS -->
      </div>
    </div>

    <!-- Bottom Status Bar -->
    <div class="h-10 bg-[#f4f4f7] border-t border-black/[0.06] px-5 flex items-center justify-between text-[11px] text-zinc-500 font-sans">
      <div class="flex items-center space-x-3">
        <span id="activeCount" class="text-emerald-600 font-medium">1 个项目运行中</span>
        <span class="text-zinc-300">•</span>
        <span id="memoryUsage" class="text-zinc-600">容器总内存: <b>420 MB</b></span>
        <span class="text-zinc-300">•</span>
        <span class="text-zinc-500 font-normal">⚡ 开启引擎无缝自愈</span>
      </div>
      <div class="flex items-center space-x-3 text-[11px]">
        <button onclick="cleanOrbCache()" class="hover:text-emerald-600 transition-colors flex items-center space-x-1">
          <span>🧹</span>
          <span>清理未用镜像与缓存</span>
        </button>
      </div>
    </div>

    <!-- macOS Native Floating HUD Capsule -->
    <div id="hudToast" class="hidden absolute bottom-14 left-1/2 transform -translate-x-1/2 z-50 hud-float pointer-events-none">
      <div class="px-4 py-2 bg-zinc-900/90 text-white border border-white/15 rounded-full shadow-[0_12px_32px_rgba(0,0,0,0.25)] backdrop-blur-xl flex items-center space-x-2.5 text-xs">
        <span id="hudIcon" class="text-sm">✨</span>
        <span id="hudMessage" class="tracking-tight font-medium">已完成操作</span>
      </div>
    </div>

    <!-- 居中精致毛玻璃项目详情弹窗 (Project Detail Modal) -->
    <div id="detailBackdrop" class="hidden absolute inset-0 z-40 bg-black/25 backdrop-blur-sm flex items-center justify-center p-6 transition-all" onclick="handleBackdropClick(event)">
      
      <div id="detailCard" class="relative w-full max-w-[520px] bg-white/95 border border-black/10 rounded-2xl shadow-[0_25px_60px_-10px_rgba(0,0,0,0.3)] backdrop-blur-2xl overflow-hidden modal-animate flex flex-col" onclick="event.stopPropagation()">
        
        <!-- Modal Top Bar -->
        <div class="px-5 py-4 border-b border-black/[0.06] flex items-center justify-between bg-zinc-50/60">
          <div class="flex items-center space-x-3">
            <div id="modalIconBox" class="w-12 h-12 squircle flex items-center justify-center icon-gloss-light shadow-sm">
            </div>
            <div>
              <div class="flex items-center space-x-2">
                <h3 id="modalTitle" class="text-base font-semibold text-zinc-900 leading-tight">项目名称</h3>
                <span id="modalStatusBadge" class="px-2 py-0.5 rounded-full text-[10px] font-medium bg-zinc-100 text-zinc-600">已停止</span>
              </div>
              <p id="modalTech" class="text-xs text-zinc-500 font-mono mt-0.5">Vue 3 · Spring Boot</p>
            </div>
          </div>

          <button onclick="closeDetailModal()" class="w-7 h-7 rounded-full bg-zinc-200/60 hover:bg-zinc-200 text-zinc-500 hover:text-zinc-800 flex items-center justify-center text-xs transition-colors">
            ✕
          </button>
        </div>

        <!-- Modal Body Content -->
        <div class="p-5 space-y-4 max-h-[380px] overflow-y-auto">
          
          <!-- Primary Actions -->
          <div id="modalActionArea" class="flex items-center space-x-2.5">
          </div>

          <!-- Developer Tools Quick Bar -->
          <div class="p-3 bg-zinc-50/80 border border-black/[0.06] rounded-xl flex items-center justify-between">
            <span class="text-xs text-zinc-500 font-medium">开发工具联动:</span>
            <div class="flex items-center space-x-2">
              <button onclick="openEditorFromModal()" class="px-2.5 py-1.5 bg-white hover:bg-blue-50 border border-black/10 hover:border-blue-300 text-zinc-700 hover:text-blue-700 rounded-lg text-xs font-medium transition-all shadow-xs flex items-center space-x-1.5">
                <svg class="w-3.5 h-3.5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg>
                <span>VS Code</span>
              </button>
              <button onclick="openTerminalFromModal()" class="px-2.5 py-1.5 bg-white hover:bg-zinc-100 border border-black/10 text-zinc-700 rounded-lg text-xs font-medium transition-all shadow-xs flex items-center space-x-1.5">
                <svg class="w-3.5 h-3.5 text-zinc-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                <span>系统终端</span>
              </button>
              <button onclick="openFinderFromModal()" class="px-2.5 py-1.5 bg-white hover:bg-zinc-100 border border-black/10 text-zinc-700 rounded-lg text-xs font-medium transition-all shadow-xs flex items-center space-x-1.5">
                <span>📂 Finder</span>
              </button>
            </div>
          </div>

          <!-- Services & Containers Breakdown -->
          <div>
            <div class="text-[11px] font-semibold uppercase tracking-wider text-zinc-400 mb-2">服务与容器清单</div>
            <div id="modalContainersList" class="space-y-1.5">
            </div>
          </div>

          <!-- Port & URL Configuration Field -->
          <div>
            <div class="flex items-center justify-between text-[11px] font-semibold uppercase tracking-wider text-zinc-400 mb-1.5">
              <span>前端访问地址 (可自定义)</span>
              <span id="modalPortStatus">端口状态检测正常</span>
            </div>
            <div class="flex items-center space-x-2">
              <input 
                id="modalUrlInput"
                type="text" 
                class="flex-1 px-3 py-1.5 bg-zinc-50 border border-black/10 rounded-lg text-xs font-mono text-zinc-800 focus:outline-none focus:border-emerald-500 focus:bg-white transition-all"
              />
              <button onclick="saveModalUrl()" class="px-3 py-1.5 bg-zinc-100 hover:bg-zinc-200 border border-black/10 text-zinc-700 text-xs font-medium rounded-lg transition-colors">
                保存
              </button>
            </div>
          </div>

        </div>

      </div>
    </div>

  </div>

  <script>
    let isOrbRunning = true; // Auto-healing simulation state

    const projects = [
      {
        id: 'hometown_vue',
        name: '家乡文旅系统',
        tech: 'Vue 3 · SpringBoot · MySQL',
        path: '/Users/liyuteng/Documents/IT/Project/Hometown/Hometown_vue',
        bgStyle: 'background: linear-gradient(145deg, #42b883 0%, #35495e 100%);',
        iconSvg: `<svg class="w-9 h-9 text-white drop-shadow-md" viewBox="0 0 24 24" fill="currentColor"><path d="M2 3h3.5L12 15 18.5 3H22L12 21 2 3zm4.5 0h3L12 8l2.5-5h3L12 13 6.5 3z"/></svg>`,
        frontendUrl: 'http://localhost:8081',
        port: '8081',
        status: 'stopped',
        containers: [
          { name: 'hometown-frontend', role: '前端 Web (Vue 3)', port: '8081 -> 80', status: 'stopped' },
          { name: 'hometown-backend', role: '后端 API (Spring Boot)', port: '8083 -> 8083', status: 'stopped' }
        ],
        hasConflict: false
      },
      {
        id: 'web-ai-project02',
        name: 'TLIAS 智能管理',
        tech: 'Java · Vue · MySQL',
        path: '/Users/liyuteng/Documents/IT/Learning/AI+JavaWeb/web-ai-project02',
        bgStyle: 'background: linear-gradient(145deg, #f39c12 0%, #d35400 100%);',
        iconSvg: `<svg class="w-9 h-9 text-white drop-shadow-md" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8h1a4 4 0 010 8h-1M2 8h16v9a4 4 0 01-4 4H6a4 4 0 01-4-4V8zM6 1v3M10 1v3M14 1v3"/></svg>`,
        frontendUrl: 'http://localhost:90',
        port: '90',
        status: 'stopped',
        containers: [
          { name: 'tlias-frontend', role: '前端界面 (Nginx)', port: '90 -> 80', status: 'stopped' },
          { name: 'tlias-backend', role: 'JavaWeb 后端服务', port: '8080 -> 8080', status: 'stopped' }
        ],
        hasConflict: true
      },
      {
        id: '2025-blog-public',
        name: '个人博客 2025',
        tech: 'Next.js · React · SSR',
        path: '/Users/liyuteng/Documents/IT/Project/2025-blog-public',
        bgStyle: 'background: linear-gradient(145deg, #1f2937 0%, #111827 100%);',
        iconSvg: `<svg class="w-9 h-9 text-white drop-shadow-md" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L1 21h22L12 2zm0 4.5l7.5 13h-15L12 6.5z"/></svg>`,
        frontendUrl: 'http://localhost:2025',
        port: '2025',
        status: 'stopped',
        containers: [
          { name: 'blog-2025', role: 'Next.js 全栈渲染容器', port: '2025 -> 2025', status: 'stopped' }
        ],
        hasConflict: false
      },
      {
        id: 'infs605-assignment2-main',
        name: '学生评教系统',
        tech: 'Python · PostgreSQL · Flask',
        path: '/Users/liyuteng/Downloads/INFS605-assignment2-main',
        bgStyle: 'background: linear-gradient(145deg, #3776ab 0%, #1e415f 100%);',
        iconSvg: `<svg class="w-9 h-9 text-[#ffd43b] drop-shadow-md" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>`,
        frontendUrl: 'http://localhost:9090',
        port: '9090',
        status: 'running',
        containers: [
          { name: 'adminer', role: '数据库 Web 管理面板', port: '9090 -> 8080', status: 'running' },
          { name: 'student-profile', role: '学生资料微服务', port: '5001 -> 5000', status: 'running' },
          { name: 'feedback', role: '评教反馈微服务', port: '5002 -> 5000', status: 'running' },
          { name: 'student-db', role: 'PostgreSQL 数据库', port: '5432 -> 5432', status: 'running' }
        ],
        hasConflict: false
      }
    ];

    let currentFilter = '';
    let currentDetailProjectId = null;
    let hudTimeout = null;

    function renderApps() {
      const grid = document.getElementById('appsGrid');
      const filtered = projects.filter(p => 
        p.name.toLowerCase().includes(currentFilter.toLowerCase()) ||
        p.port.includes(currentFilter) ||
        p.tech.toLowerCase().includes(currentFilter.toLowerCase())
      );

      const runningCount = projects.filter(p => p.status === 'running').length;
      document.getElementById('activeCount').innerText = `${runningCount} 个项目运行中`;
      document.getElementById('totalCount').innerText = `共 ${projects.length} 个项目`;
      document.getElementById('memoryUsage').innerHTML = `容器总内存: <b>${runningCount * 210 + 20} MB</b>`;

      let html = filtered.map(p => {
        const isRunning = p.status === 'running';
        const isStarting = p.status === 'starting';

        return `
          <div 
            id="app-${p.id}"
            class="group relative flex flex-col items-center cursor-pointer w-32 select-none"
            onclick="openDetailModal('${p.id}')"
          >
            <!-- Squircle Native App Icon Box -->
            <div class="relative w-20 h-20 mb-2 app-icon">
              
              <!-- Brand Gradient Squircle with Inset Specular Highlight -->
              <div 
                class="w-full h-full squircle flex items-center justify-center icon-gloss-light ${isStarting ? 'launching-wave-light' : ''}"
                style="${p.bgStyle}"
              >
                ${p.iconSvg}
              </div>

              <!-- Top-Right Crisp Port Badge or In-place Conflict Alert Badge -->
              ${p.hasConflict ? `
                <div 
                  title="端口 :${p.port} 被占用" 
                  class="absolute -top-1.5 -right-1.5 px-1.5 py-0.5 bg-amber-500 border border-white text-[10px] font-mono text-white font-bold rounded-full shadow-md flex items-center space-x-0.5 animate-pulse"
                >
                  <span>⚠️</span>
                  <span>:${p.port}</span>
                </div>
              ` : `
                <div class="absolute -top-1.5 -right-1.5 px-1.5 py-0.5 bg-white/95 backdrop-blur-md border border-black/10 text-[10px] font-mono text-zinc-700 font-medium rounded-md shadow-xs">
                  :${p.port}
                </div>
              `}

              <!-- Hover Tooltip Hint: Click to View Details -->
              <div class="absolute -bottom-1 -right-1 opacity-0 group-hover:opacity-100 transition-opacity bg-white border border-black/15 text-zinc-600 p-1 rounded-full shadow-md z-10" title="点击查看详情">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
              </div>

              <!-- Starting Spinner Overlay -->
              ${isStarting ? `
                <div class="absolute inset-0 squircle bg-black/45 backdrop-blur-xs flex flex-col items-center justify-center">
                  <svg class="animate-spin w-5 h-5 text-white" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
                    <path class="opacity-90" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                  </svg>
                  <span class="text-[9px] text-white mt-1 font-medium tracking-tight">探活中</span>
                </div>
              ` : ''}

            </div>

            <!-- App Title (Refined Apple Typography) -->
            <div class="text-[12px] font-medium text-zinc-700 group-hover:text-zinc-950 text-center truncate w-full px-1 tracking-tight">
              ${p.name}
            </div>

            <!-- Running Dot Indicator (macOS Dock Emerald LED) -->
            <div class="h-2 flex items-center justify-center mt-1">
              ${isRunning ? `
                <div class="w-1.5 h-1.5 rounded-full bg-emerald-500 led-green-light"></div>
              ` : isStarting ? `
                <div class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse"></div>
              ` : `
                <div class="w-1.5 h-1.5 rounded-full bg-transparent"></div>
              `}
            </div>

          </div>
        `;
      }).join('');

      // Add "Import Project" Squircle Icon
      html += `
        <div 
          class="group flex flex-col items-center cursor-pointer w-32 select-none"
          onclick="importProject()"
        >
          <div class="w-20 h-20 mb-2 squircle border-2 border-dashed border-zinc-300 hover:border-emerald-500 bg-zinc-100/70 hover:bg-emerald-50/40 flex items-center justify-center app-icon shadow-xs">
            <svg class="w-7 h-7 text-zinc-400 group-hover:text-emerald-600 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 4v16m8-8H4"/>
            </svg>
          </div>
          <div class="text-[12px] font-medium text-zinc-500 group-hover:text-emerald-700 text-center tracking-tight">
            导入新项目
          </div>
          <div class="h-2"></div>
        </div>
      `;

      grid.innerHTML = html;
    }

    // Detail Modal Controller
    function openDetailModal(id) {
      const p = projects.find(item => item.id === id);
      if (!p) return;
      currentDetailProjectId = id;

      document.getElementById('modalTitle').innerText = p.name;
      document.getElementById('modalTech').innerText = p.tech;
      document.getElementById('modalUrlInput').value = p.frontendUrl;

      const iconBox = document.getElementById('modalIconBox');
      iconBox.style = p.bgStyle;
      iconBox.innerHTML = p.iconSvg;

      const badge = document.getElementById('modalStatusBadge');
      if (p.status === 'running') {
        badge.className = 'px-2 py-0.5 rounded-full text-[10px] font-medium bg-emerald-100 text-emerald-700 flex items-center space-x-1';
        badge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-500 led-green-light"></span><span>运行中</span>`;
      } else if (p.status === 'starting') {
        badge.className = 'px-2 py-0.5 rounded-full text-[10px] font-medium bg-amber-100 text-amber-700';
        badge.innerText = isOrbRunning ? '启动探活中...' : '自愈唤醒 OrbStack 中...';
      } else {
        badge.className = 'px-2 py-0.5 rounded-full text-[10px] font-medium bg-zinc-100 text-zinc-600';
        badge.innerText = '已停止';
      }

      renderModalActions(p);

      const contList = document.getElementById('modalContainersList');
      contList.innerHTML = p.containers.map(c => `
        <div class="px-3 py-2 bg-zinc-50 border border-black/[0.05] rounded-lg flex items-center justify-between text-xs">
          <div class="flex items-center space-x-2">
            <span class="w-2 h-2 rounded-full ${p.status === 'running' ? 'bg-emerald-500' : 'bg-zinc-300'}"></span>
            <span class="font-medium text-zinc-800">${c.name}</span>
            <span class="text-zinc-400 font-mono text-[11px]">(${c.role})</span>
          </div>
          <span class="px-1.5 py-0.5 bg-white border border-zinc-200 text-zinc-600 font-mono text-[10px] rounded">
            ${c.port}
          </span>
        </div>
      `).join('');

      const portStatus = document.getElementById('modalPortStatus');
      if (p.hasConflict) {
        portStatus.className = 'text-amber-600 font-semibold cursor-pointer';
        portStatus.innerHTML = `⚠️ 端口 :${p.port} 被占用 [<a onclick="resolveConflictFromModal('${p.id}')" class="underline">一键释放</a>]`;
      } else {
        portStatus.className = 'text-emerald-600';
        portStatus.innerText = '✓ 端口状态检测正常';
      }

      document.getElementById('detailBackdrop').classList.remove('hidden');
    }

    function renderModalActions(p) {
      const area = document.getElementById('modalActionArea');
      if (p.status === 'stopped') {
        area.innerHTML = `
          <button onclick="launchProjectFromModal('${p.id}')" class="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-medium rounded-xl text-xs transition-all shadow-md shadow-emerald-600/20 flex items-center justify-center space-x-2">
            <span class="text-sm">🚀</span>
            <span>一键启动并进入前端网页</span>
          </button>
        `;
      } else if (p.status === 'starting') {
        area.innerHTML = `
          <button disabled class="flex-1 py-2.5 bg-zinc-200 text-zinc-600 font-medium rounded-xl text-xs cursor-not-allowed flex items-center justify-center space-x-2">
            <svg class="animate-spin h-4 w-4 text-zinc-600" viewBox="0 0 24 24" fill="none">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
            </svg>
            <span id="modalStartingMsg">${isOrbRunning ? '正在启动容器并探活中...' : '⚡ 正在自愈唤醒 OrbStack 引擎...'}</span>
          </button>
        `;
      } else if (p.status === 'running') {
        area.innerHTML = `
          <button onclick="openWebFromModal('${p.id}')" class="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-medium rounded-xl text-xs transition-all shadow-md shadow-emerald-600/20 flex items-center justify-center space-x-2">
            <span class="text-sm">🌐</span>
            <span>在浏览器打开前端页面</span>
          </button>
          <button onclick="stopProjectFromModal('${p.id}')" class="px-4 py-2.5 bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 font-medium rounded-xl text-xs transition-colors flex items-center space-x-1.5">
            <span>⏹</span>
            <span>停止容器</span>
          </button>
          <button onclick="restartProjectFromModal('${p.id}')" class="p-2.5 bg-zinc-100 hover:bg-zinc-200 text-zinc-600 border border-black/10 rounded-xl transition-colors" title="重启项目">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          </button>
        `;
      }
    }

    function closeDetailModal() {
      document.getElementById('detailBackdrop').classList.add('hidden');
      currentDetailProjectId = null;
    }

    function handleBackdropClick(e) {
      closeDetailModal();
    }

    // ============================================
    // Core Auto-Healing + Startup Workflow
    // ============================================
    function launchProjectFromModal(id) {
      const p = projects.find(item => item.id === id);
      if (!p) return;

      if (p.hasConflict) {
        showHudToast('⚠️', `端口 :${p.port} 正被占用，请先在面板中释放！`);
        return;
      }

      p.status = 'starting';
      renderApps();
      openDetailModal(id);

      // Auto-healing Check: If OrbStack daemon is not running
      if (!isOrbRunning) {
        showHudToast('⚡', '检测到 OrbStack 未启动，正在静默唤醒引擎中...');
        setTimeout(() => {
          isOrbRunning = true;
          updateOrbHeaderUi(true);
          showHudToast('🚀', `OrbStack 引擎已自愈就绪！继续启动 [${p.name}] 容器...`);
          
          // Proceed to start container
          setTimeout(() => {
            p.status = 'running';
            renderApps();
            if (currentDetailProjectId === id) openDetailModal(id);
            showHudToast('🎉', `[${p.name}] 服务就绪！已打开浏览器页面`);
            window.open(p.frontendUrl, '_blank');
          }, 1400);
        }, 1800);
      } else {
        // OrbStack already running
        showHudToast('🚀', `正在启动 [${p.name}] 并探活端口 :${p.port}...`);
        setTimeout(() => {
          p.status = 'running';
          renderApps();
          if (currentDetailProjectId === id) openDetailModal(id);
          showHudToast('🎉', `[${p.name}] 服务就绪！已打开浏览器页面`);
          window.open(p.frontendUrl, '_blank');
        }, 1500);
      }
    }

    function toggleOrbStatusForDemo() {
      isOrbRunning = !isOrbRunning;
      updateOrbHeaderUi(isOrbRunning);
      showHudToast(
        isOrbRunning ? '🟢' : '⚪', 
        isOrbRunning ? 'OrbStack 运行中' : 'OrbStack 已待机（点击项目将自动唤醒自愈）'
      );
    }

    function updateOrbHeaderUi(running) {
      const headerBox = document.getElementById('orbHeaderStatus');
      const led = document.getElementById('orbLed');
      const text = document.getElementById('orbStatusText');

      if (running) {
        headerBox.className = 'cursor-pointer flex items-center space-x-1.5 px-2.5 py-1 bg-emerald-50 border border-emerald-200/80 rounded-full shadow-xs transition-colors';
        led.className = 'w-1.5 h-1.5 rounded-full bg-emerald-500 led-green-light';
        text.className = 'text-[11px] text-emerald-700 font-medium';
        text.innerText = 'OrbStack 正常';
      } else {
        headerBox.className = 'cursor-pointer flex items-center space-x-1.5 px-2.5 py-1 bg-zinc-100 border border-zinc-200 rounded-full shadow-xs transition-colors';
        led.className = 'w-1.5 h-1.5 rounded-full bg-zinc-400';
        text.className = 'text-[11px] text-zinc-500 font-medium';
        text.innerText = 'OrbStack 待机 (自动唤醒)';
      }
    }

    function openWebFromModal(id) {
      const p = projects.find(item => item.id === id);
      if (p) {
        showHudToast('🌐', `已打开前端网页: ${p.frontendUrl}`);
        window.open(p.frontendUrl, '_blank');
      }
    }

    function stopProjectFromModal(id) {
      const p = projects.find(item => item.id === id);
      if (p) {
        p.status = 'stopped';
        renderApps();
        if (currentDetailProjectId === id) openDetailModal(id);
        showHudToast('⏹', `已停止 [${p.name}] 全部容器`);
      }
    }

    function restartProjectFromModal(id) {
      launchProjectFromModal(id);
    }

    function openEditorFromModal() {
      const p = projects.find(item => item.id === currentDetailProjectId);
      if (p) {
        showHudToast('💻', `已在 VS Code / Cursor 中打开 [${p.name}]`);
      }
    }

    function openTerminalFromModal() {
      const p = projects.find(item => item.id === currentDetailProjectId);
      if (p) {
        showHudToast('🖥️', `已在系统终端中定位至: ${p.path}`);
      }
    }

    function openFinderFromModal() {
      const p = projects.find(item => item.id === currentDetailProjectId);
      if (p) {
        showHudToast('📂', `已在 Finder 中显示 [${p.name}] 目录`);
      }
    }

    function resolveConflictFromModal(id) {
      const p = projects.find(item => item.id === id);
      if (p) {
        p.hasConflict = false;
        renderApps();
        openDetailModal(id);
        showHudToast('✅', `端口 :${p.port} 已成功释放 (PID: 34120 已结束)`);
      }
    }

    function saveModalUrl() {
      const p = projects.find(item => item.id === currentDetailProjectId);
      const newUrl = document.getElementById('modalUrlInput').value;
      if (p && newUrl) {
        p.frontendUrl = newUrl;
        showHudToast('✏️', `前端打开地址已更新为: ${newUrl}`);
      }
    }

    function sleepAllContainers() {
      const runningProjects = projects.filter(p => p.status === 'running');
      if (runningProjects.length === 0) {
        showHudToast('💤', '当前没有运行中的容器需要休眠');
        return;
      }
      runningProjects.forEach(p => p.status = 'stopped');
      renderApps();
      if (currentDetailProjectId) openDetailModal(currentDetailProjectId);
      showHudToast('🌙', `已一键休眠所有容器，已释放 OrbStack 内存与 CPU`);
    }

    function cleanOrbCache() {
      showHudToast('🧹', '正在清理未引用镜像与缓存...');
      setTimeout(() => {
        showHudToast('✨', 'OrbStack 缓存清理完成，已回收约 1.4 GB 空间');
      }, 1200);
    }

    function showHudToast(icon, message) {
      const hud = document.getElementById('hudToast');
      document.getElementById('hudIcon').innerText = icon;
      document.getElementById('hudMessage').innerText = message;
      hud.classList.remove('hidden');

      if (hudTimeout) clearTimeout(hudTimeout);
      hudTimeout = setTimeout(() => {
        hud.classList.add('hidden');
      }, 2300);
    }

    function handleSearch(val) {
      currentFilter = val;
      renderApps();
    }

    function importProject() {
      showHudToast('📁', '选择本地含 docker-compose.yml 的目录即可导入');
    }

    function handleGlobalClick(e) {
      // reserved
    }

    renderApps();
  </script>
</body>
</html>
