<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open-Easy 开发者工作台 (浅色功能增强版)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes launch-wave-light {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6); }
      70% { box-shadow: 0 0 0 14px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
    .launching-wave-light {
      animation: launch-wave-light 1.4s cubic-bezier(0.24, 0, 0.38, 1) infinite;
    }
    .squircle {
      border-radius: 22.5%;
    }
    .app-icon {
      transition: all 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .app-icon:hover {
      transform: translateY(-3px) scale(1.04);
    }
    .app-icon:active {
      transform: translateY(1px) scale(0.92);
    }
    .icon-gloss-light {
      box-shadow: inset 0 1px 1.5px 0 rgba(255, 255, 255, 0.7), 
                  0 10px 24px -4px rgba(0, 0, 0, 0.12), 
                  0 3px 8px -1px rgba(0, 0, 0, 0.06);
    }
    .led-green-light {
      box-shadow: 0 0 6px #10b981;
    }
  </style>
</head>
<body class="bg-[#e7e7eb] text-zinc-800 antialiased p-8 flex flex-col items-center justify-center min-h-screen select-none font-sans" onclick="hideContextMenu()">

  <!-- macOS Native Window Container (780 x 580) - Clean Studio Light Edition -->
  <div class="relative w-full max-w-[780px] h-[580px] bg-[#fbfbfd]/95 border border-black/10 rounded-2xl shadow-[0_20px_60px_-15px_rgba(0,0,0,0.18)] backdrop-blur-2xl overflow-hidden flex flex-col">
    
    <!-- Titlebar - Authentic macOS Light Header -->
    <div class="h-11 bg-[#f0f0f3]/90 border-b border-black/[0.08] px-4 flex items-center justify-between select-none">
      <div class="flex items-center space-x-2">
        <div class="w-3 h-3 rounded-full bg-[#ff5f56] border border-[#e0443e]"></div>
        <div class="w-3 h-3 rounded-full bg-[#ffbd2e] border border-[#dea123]"></div>
        <div class="w-3 h-3 rounded-full bg-[#27c93f] border border-[#1aab29]"></div>
        <span class="ml-4 text-xs font-semibold tracking-wide text-zinc-600">Open-Easy 开发者工作台</span>
      </div>

      <!-- Center Search Capsule -->
      <div class="relative w-60">
        <input 
          id="searchInput"
          type="text" 
          placeholder="搜索项目、技术栈或端口..." 
          class="w-full pl-8 pr-3 py-1 bg-white/90 border border-black/10 rounded-full text-xs text-zinc-700 placeholder-zinc-400 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500/20 transition-all text-center focus:text-left font-normal shadow-xs"
          oninput="handleSearch(this.value)"
        />
        <svg class="w-3.5 h-3.5 text-zinc-400 absolute left-3 top-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
      </div>

      <!-- Header Quick Actions -->
      <div class="flex items-center space-x-2">
        <!-- Global Sleep / Free Memory Button -->
        <button onclick="sleepAllContainers()" title="一键停止所有运行容器并释放 OrbStack 内存" class="px-2.5 py-1 bg-amber-50 hover:bg-amber-100 border border-amber-200/80 text-amber-800 rounded-full text-[11px] font-medium transition-all shadow-xs flex items-center space-x-1">
          <span>🌙</span>
          <span>一键休眠</span>
        </button>

        <!-- OrbStack Indicator -->
        <div class="flex items-center space-x-1.5 px-2.5 py-1 bg-emerald-50 border border-emerald-200/80 rounded-full shadow-xs">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 led-green-light"></span>
          <span class="text-[11px] text-emerald-700 font-medium">OrbStack 正常</span>
        </div>
      </div>
    </div>

    <!-- Notification Toast Banner -->
    <div id="toast" class="hidden px-5 py-2 bg-emerald-600 border-b border-emerald-700 text-white text-xs flex items-center justify-between shadow-md transition-all">
      <div class="flex items-center space-x-2.5">
        <span class="text-sm">✨</span>
        <span id="toastText">操作成功</span>
      </div>
      <button onclick="dismissToast()" class="text-emerald-200 hover:text-white">✕</button>
    </div>

    <!-- Port Conflict Alert Pill (if any) -->
    <div id="conflictAlert" class="px-5 py-2 bg-amber-50/90 border-b border-amber-200 text-amber-800 text-[11px] flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <span class="text-sm">⚠️</span>
        <span><b>端口健康扫描</b>：项目 [TLIAS 智能管理] 端口 <code class="px-1 py-0.5 bg-amber-200/60 rounded text-amber-900 font-mono">:90</code> 正被本地进程占用 (PID: 34120)。</span>
      </div>
      <div class="flex items-center space-x-2">
        <button onclick="resolvePortConflict('90')" class="px-2 py-0.5 bg-amber-600 hover:bg-amber-700 text-white text-[10px] font-medium rounded transition-colors">
          一键释放端口
        </button>
        <button onclick="dismissConflict()" class="text-amber-500 hover:text-amber-700">✕</button>
      </div>
    </div>

    <!-- Launchpad Grid Body -->
    <div class="flex-1 p-7 overflow-y-auto">
      <div class="mb-4 px-2 flex items-center justify-between text-[11px] text-zinc-500 font-medium">
        <div class="flex items-center space-x-2">
          <span class="uppercase tracking-wider text-[10px] font-semibold text-zinc-400">已接入的 Compose 项目</span>
          <span class="text-zinc-300">|</span>
          <span class="text-zinc-400 text-[10px]">双击或点击启动前端 · 悬浮快捷打开编辑器</span>
        </div>
        <div class="flex items-center space-x-3 text-zinc-400 text-[10px]">
          <span class="flex items-center space-x-1"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span><span>运行中</span></span>
          <span class="flex items-center space-x-1"><span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span><span>端口冲突</span></span>
          <span class="flex items-center space-x-1"><span class="w-1.5 h-1.5 rounded-full bg-zinc-300"></span><span>已休眠</span></span>
        </div>
      </div>

      <!-- 4 Columns Grid -->
      <div id="appsGrid" class="grid grid-cols-4 gap-y-6 gap-x-4 justify-items-center">
        <!-- Injected via JS -->
      </div>
    </div>

    <!-- Bottom Status Bar with Resource Metrics -->
    <div class="h-10 bg-[#f4f4f7] border-t border-black/[0.06] px-5 flex items-center justify-between text-[11px] text-zinc-500 font-sans">
      <div class="flex items-center space-x-3">
        <span id="activeCount" class="text-emerald-600 font-medium">1 个项目运行中</span>
        <span class="text-zinc-300">•</span>
        <span id="memoryUsage" class="text-zinc-600">容器总内存: <b>420 MB</b></span>
        <span class="text-zinc-300">•</span>
        <span id="totalCount" class="text-zinc-500">共 4 个项目</span>
      </div>
      <div class="flex items-center space-x-3 text-[11px]">
        <button onclick="cleanOrbCache()" class="hover:text-emerald-600 transition-colors flex items-center space-x-1">
          <span>🧹</span>
          <span>清理未用镜像与缓存</span>
        </button>
      </div>
    </div>

  </div>

  <!-- macOS Enhanced Context Menu -->
  <div id="contextMenu" class="hidden fixed z-50 w-52 bg-white/95 border border-black/10 rounded-xl shadow-[0_15px_35px_-5px_rgba(0,0,0,0.2)] backdrop-blur-2xl py-1 text-xs text-zinc-700 divide-y divide-zinc-100">
    <div class="px-3 py-1.5 text-[10px] uppercase font-semibold text-zinc-400 tracking-wider truncate" id="ctxProjectTitle">项目操作</div>
    
    <!-- Code Editor Section -->
    <div class="py-1">
      <button onclick="ctxAction('vscode')" class="w-full px-3 py-1.5 text-left hover:bg-emerald-500 hover:text-white flex items-center space-x-2 transition-colors">
        <svg class="w-3.5 h-3.5 text-blue-500 group-hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg>
        <span>在 VS Code / Cursor 中打开</span>
      </button>
      <button onclick="ctxAction('terminal')" class="w-full px-3 py-1.5 text-left hover:bg-emerald-500 hover:text-white flex items-center space-x-2 transition-colors">
        <svg class="w-3.5 h-3.5 text-zinc-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        <span>在终端中打开目录</span>
      </button>
    </div>

    <!-- Container Lifecycle Section -->
    <div class="py-1">
      <button onclick="ctxAction('open')" class="w-full px-3 py-1.5 text-left hover:bg-emerald-500 hover:text-white flex items-center space-x-2 transition-colors">
        <span>🌐</span>
        <span>打开前端网页</span>
      </button>
      <button onclick="ctxAction('launch')" class="w-full px-3 py-1.5 text-left hover:bg-emerald-500 hover:text-white flex items-center space-x-2 transition-colors">
        <span>🚀</span>
        <span>启动容器</span>
      </button>
      <button onclick="ctxAction('restart')" class="w-full px-3 py-1.5 text-left hover:bg-emerald-500 hover:text-white flex items-center space-x-2 transition-colors">
        <span>🔄</span>
        <span>重启容器</span>
      </button>
      <button onclick="ctxAction('stop')" class="w-full px-3 py-1.5 text-left hover:bg-red-500 hover:text-white flex items-center space-x-2 transition-colors text-red-500">
        <span>⏹</span>
        <span>停止容器 (释放资源)</span>
      </button>
    </div>

    <!-- Diagnostic & Edit Section -->
    <div class="py-1">
      <button onclick="ctxAction('checkPort')" class="w-full px-3 py-1.5 text-left hover:bg-zinc-100 flex items-center space-x-2 transition-colors">
        <span>🔍</span>
        <span>检测端口占用状态</span>
      </button>
      <button onclick="ctxAction('edit')" class="w-full px-3 py-1.5 text-left hover:bg-zinc-100 flex items-center space-x-2 transition-colors">
        <span>✏️</span>
        <span>修改地址与端口</span>
      </button>
    </div>
  </div>

  <script>
    const projects = [
      {
        id: 'hometown_vue',
        name: '家乡文旅系统',
        tech: 'Vue 3 · SpringBoot',
        path: '/Users/liyuteng/Documents/IT/Project/Hometown/Hometown_vue',
        bgStyle: 'background: linear-gradient(145deg, #42b883 0%, #35495e 100%);',
        iconSvg: `<svg class="w-9 h-9 text-white drop-shadow-md" viewBox="0 0 24 24" fill="currentColor"><path d="M2 3h3.5L12 15 18.5 3H22L12 21 2 3zm4.5 0h3L12 8l2.5-5h3L12 13 6.5 3z"/></svg>`,
        frontendUrl: 'http://localhost:8081',
        port: '8081',
        status: 'stopped',
        hasConflict: false
      },
      {
        id: 'web-ai-project02',
        name: 'TLIAS 智能管理',
        tech: 'Java · Spring Boot',
        path: '/Users/liyuteng/Documents/IT/Learning/AI+JavaWeb/web-ai-project02',
        bgStyle: 'background: linear-gradient(145deg, #f39c12 0%, #d35400 100%);',
        iconSvg: `<svg class="w-9 h-9 text-white drop-shadow-md" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8h1a4 4 0 010 8h-1M2 8h16v9a4 4 0 01-4 4H6a4 4 0 01-4-4V8zM6 1v3M10 1v3M14 1v3"/></svg>`,
        frontendUrl: 'http://localhost:90',
        port: '90',
        status: 'stopped',
        hasConflict: true // Sample port conflict alert
      },
      {
        id: '2025-blog-public',
        name: '个人博客 2025',
        tech: 'Next.js · React',
        path: '/Users/liyuteng/Documents/IT/Project/2025-blog-public',
        bgStyle: 'background: linear-gradient(145deg, #1f2937 0%, #111827 100%);',
        iconSvg: `<svg class="w-9 h-9 text-white drop-shadow-md" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L1 21h22L12 2zm0 4.5l7.5 13h-15L12 6.5z"/></svg>`,
        frontendUrl: 'http://localhost:2025',
        port: '2025',
        status: 'stopped',
        hasConflict: false
      },
      {
        id: 'infs605-assignment2-main',
        name: '学生评教系统',
        tech: 'Python · PostgreSQL',
        path: '/Users/liyuteng/Downloads/INFS605-assignment2-main',
        bgStyle: 'background: linear-gradient(145deg, #3776ab 0%, #1e415f 100%);',
        iconSvg: `<svg class="w-9 h-9 text-[#ffd43b] drop-shadow-md" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>`,
        frontendUrl: 'http://localhost:9090',
        port: '9090',
        status: 'running',
        hasConflict: false
      }
    ];

    let currentFilter = '';
    let selectedProjectId = null;

    function renderApps() {
      const grid = document.getElementById('appsGrid');
      const filtered = projects.filter(p => 
        p.name.toLowerCase().includes(currentFilter.toLowerCase()) ||
        p.port.includes(currentFilter) ||
        p.tech.toLowerCase().includes(currentFilter.toLowerCase())
      );

      const runningCount = projects.filter(p => p.status === 'running').length;
      document.getElementById('activeCount').innerText = `${runningCount} 个项目运行中`;
      document.getElementById('totalCount').innerText = `共 ${projects.length} 个项目`;
      document.getElementById('memoryUsage').innerHTML = `容器总内存: <b>${runningCount * 210 + 20} MB</b>`;

      let html = filtered.map(p => {
        const isRunning = p.status === 'running';
        const isStarting = p.status === 'starting';

        return `
          <div 
            class="group relative flex flex-col items-center cursor-pointer w-32 select-none"
            onclick="handleAppClick('${p.id}')"
            oncontextmenu="handleContextMenu(event, '${p.id}')"
          >
            <!-- Squircle Native App Icon Box -->
            <div class="relative w-20 h-20 mb-2 app-icon">
              
              <!-- Brand Gradient Squircle with Inset Specular Highlight -->
              <div 
                class="w-full h-full squircle flex items-center justify-center icon-gloss-light ${isStarting ? 'launching-wave-light' : ''}"
                style="${p.bgStyle}"
              >
                ${p.iconSvg}
              </div>

              <!-- Top-Right Crisp Light Frosted Port Badge (Or Conflict Alert) -->
              ${p.hasConflict ? `
                <div title="端口 :${p.port} 被占用" class="absolute -top-1.5 -right-1.5 px-1.5 py-0.5 bg-amber-500 border border-amber-300 text-[10px] font-mono text-white font-bold rounded-md shadow-xs animate-bounce">
                  ⚠️ :${p.port}
                </div>
              ` : `
                <div class="absolute -top-1.5 -right-1.5 px-1.5 py-0.5 bg-white/95 backdrop-blur-md border border-black/10 text-[10px] font-mono text-zinc-700 font-medium rounded-md shadow-xs">
                  :${p.port}
                </div>
              `}

              <!-- Hover Quick Action Pill: Open in VS Code -->
              <div 
                onclick="event.stopPropagation(); openEditor('${p.path}')"
                title="在 VS Code / Cursor 中打开代码"
                class="absolute -bottom-1 -right-1 opacity-0 group-hover:opacity-100 transition-opacity bg-white hover:bg-zinc-100 border border-black/15 text-zinc-700 p-1 rounded-full shadow-md z-10"
              >
                <svg class="w-3.5 h-3.5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/>
                </svg>
              </div>

              <!-- Starting Spinner Overlay -->
              ${isStarting ? `
                <div class="absolute inset-0 squircle bg-black/45 backdrop-blur-xs flex flex-col items-center justify-center">
                  <svg class="animate-spin w-5 h-5 text-white" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
                    <path class="opacity-90" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                  </svg>
                  <span class="text-[9px] text-white mt-1 font-medium tracking-tight">探活中</span>
                </div>
              ` : ''}

            </div>

            <!-- App Title (Refined Apple Typography) -->
            <div class="text-[12px] font-medium text-zinc-700 group-hover:text-zinc-950 text-center truncate w-full px-1 tracking-tight">
              ${p.name}
            </div>

            <!-- Running Dot Indicator (macOS Dock Emerald LED) -->
            <div class="h-2 flex items-center justify-center mt-1">
              ${isRunning ? `
                <div class="w-1.5 h-1.5 rounded-full bg-emerald-500 led-green-light"></div>
              ` : isStarting ? `
                <div class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse"></div>
              ` : `
                <div class="w-1.5 h-1.5 rounded-full bg-transparent"></div>
              `}
            </div>

          </div>
        `;
      }).join('');

      // Add "Import Project" Squircle Icon (Clean Light Theme)
      html += `
        <div 
          class="group flex flex-col items-center cursor-pointer w-32 select-none"
          onclick="importProject()"
        >
          <div class="w-20 h-20 mb-2 squircle border-2 border-dashed border-zinc-300 hover:border-emerald-500 bg-zinc-100/70 hover:bg-emerald-50/40 flex items-center justify-center app-icon shadow-xs">
            <svg class="w-7 h-7 text-zinc-400 group-hover:text-emerald-600 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 4v16m8-8H4"/>
            </svg>
          </div>
          <div class="text-[12px] font-medium text-zinc-500 group-hover:text-emerald-700 text-center tracking-tight">
            导入新项目
          </div>
          <div class="h-2"></div>
        </div>
      `;

      grid.innerHTML = html;
    }

    function handleAppClick(id) {
      const p = projects.find(item => item.id === id);
      if (!p) return;

      if (p.hasConflict) {
        showToast(`⚠️ 项目 [${p.name}] 端口 :${p.port} 正被占用，请先释放或更换端口！`);
        return;
      }

      if (p.status === 'running') {
        showToast(`[${p.name}] 正在运行，已唤起默认浏览器: ${p.frontendUrl}`);
        window.open(p.frontendUrl, '_blank');
        return;
      }

      if (p.status === 'starting') {
        showToast(`[${p.name}] 正在启动并检测端口中...`);
        return;
      }

      p.status = 'starting';
      renderApps();
      showToast(`正在启动 [${p.name}] 容器，并探活端口 :${p.port}...`);

      setTimeout(() => {
        p.status = 'running';
        renderApps();
        showToast(`🎉 服务已就绪！已自动在浏览器中打开: ${p.frontendUrl}`);
        window.open(p.frontendUrl, '_blank');
      }, 1600);
    }

    function openEditor(path) {
      showToast(`💻 正在使用默认编辑器 (VS Code / Cursor) 打开目录: ${path}`);
    }

    function sleepAllContainers() {
      const runningProjects = projects.filter(p => p.status === 'running');
      if (runningProjects.length === 0) {
        showToast('当前没有正在运行的容器需要休眠');
        return;
      }
      runningProjects.forEach(p => p.status = 'stopped');
      renderApps();
      showToast(`🌙 已一键休眠所有项目容器，释放 OrbStack 内存与 CPU！`);
    }

    function resolvePortConflict(port) {
      const p = projects.find(item => item.port === port);
      if (p) {
        p.hasConflict = false;
        renderApps();
        dismissConflict();
        showToast(`✅ 端口 :${port} 冲突已解除 (已结束占用进程 PID: 34120)`);
      }
    }

    function dismissConflict() {
      document.getElementById('conflictAlert').classList.add('hidden');
    }

    function cleanOrbCache() {
      showToast('🧹 正在调用 `docker system prune` 清理未引用的悬空镜像与容器缓存...');
      setTimeout(() => {
        showToast('✅ OrbStack 缓存清理完成，已回收约 1.4 GB 磁盘空间！');
      }, 1200);
    }

    function handleContextMenu(e, id) {
      e.preventDefault();
      selectedProjectId = id;
      const p = projects.find(item => item.id === id);
      if (!p) return;

      document.getElementById('ctxProjectTitle').innerText = p.name;
      const menu = document.getElementById('contextMenu');
      menu.style.left = `${e.clientX}px`;
      menu.style.top = `${e.clientY}px`;
      menu.classList.remove('hidden');
    }

    function hideContextMenu() {
      document.getElementById('contextMenu').classList.add('hidden');
    }

    function ctxAction(type) {
      const p = projects.find(item => item.id === selectedProjectId);
      if (!p) return;

      if (type === 'vscode') {
        openEditor(p.path);
      } else if (type === 'terminal') {
        showToast(`🖥️ 正在终端中定位到: ${p.path}`);
      } else if (type === 'open') {
        window.open(p.frontendUrl, '_blank');
        showToast(`在浏览器中打开: ${p.frontendUrl}`);
      } else if (type === 'launch') {
        handleAppClick(p.id);
      } else if (type === 'restart') {
        p.status = 'starting';
        renderApps();
        showToast(`重启项目 [${p.name}]...`);
        setTimeout(() => {
          p.status = 'running';
          renderApps();
          showToast(`[${p.name}] 重启就绪`);
        }, 1500);
      } else if (type === 'stop') {
        p.status = 'stopped';
        renderApps();
        showToast(`已停止项目 [${p.name}] 容器`);
      } else if (type === 'checkPort') {
        showToast(`🔍 正在扫描端口 :${p.port} 占用状态... [正常，未被其他进程抢占]`);
      } else if (type === 'edit') {
        const newUrl = prompt(`修改 [${p.name}] 的前端打开地址:`, p.frontendUrl);
        if (newUrl) {
          p.frontendUrl = newUrl;
          showToast(`已更新前端地址: ${newUrl}`);
        }
      }
      hideContextMenu();
    }

    function handleSearch(val) {
      currentFilter = val;
      renderApps();
    }

    function importProject() {
      alert('在完整应用中，将唤起 macOS 原生文件夹选择器，选择含 docker-compose.yml 的目录即可将其作为新应用图标加入！');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      const text = document.getElementById('toastText');
      text.innerText = msg;
      t.classList.remove('hidden');
    }

    function dismissToast() {
      document.getElementById('toast').classList.add('hidden');
    }

    renderApps();
  </script>
</body>
</html>
