<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open-Easy (Launchpad 风格) 效果预览</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.7); }
      70% { box-shadow: 0 0 0 14px rgba(99, 102, 241, 0); }
      100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); }
    }
    .launching-ring {
      animation: pulse-ring 1.4s cubic-bezier(0.24, 0, 0.38, 1) infinite;
    }
    .squircle {
      border-radius: 22.5%;
    }
    .app-icon-press {
      transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .app-icon-press:active {
      transform: scale(0.88);
    }
    .dot-glow {
      box-shadow: 0 0 8px #34d399;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950 text-slate-100 antialiased p-8 flex flex-col items-center justify-center min-h-screen select-none" onclick="hideContextMenu()">

  <!-- macOS App Window Frame (740 x 540) -->
  <div class="relative w-full max-w-[740px] h-[550px] bg-slate-900/80 border border-slate-700/60 rounded-3xl shadow-[0_25px_60px_-15px_rgba(0,0,0,0.7)] backdrop-blur-2xl overflow-hidden flex flex-col">
    
    <!-- macOS Window Titlebar -->
    <div class="h-12 bg-slate-850/80 border-b border-slate-800/80 px-5 flex items-center justify-between select-none">
      <div class="flex items-center space-x-2">
        <div class="w-3 h-3 rounded-full bg-red-500/80 border border-red-600/50"></div>
        <div class="w-3 h-3 rounded-full bg-yellow-500/80 border border-yellow-600/50"></div>
        <div class="w-3 h-3 rounded-full bg-green-500/80 border border-green-600/50"></div>
        <span class="ml-4 text-xs font-semibold tracking-wide text-slate-300">Open-Easy</span>
      </div>

      <!-- Top Search Pill -->
      <div class="relative w-64">
        <input 
          id="searchInput"
          type="text" 
          placeholder="搜索项目或端口..." 
          class="w-full pl-8 pr-3 py-1 bg-slate-800/90 border border-slate-700/80 rounded-full text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-all text-center focus:text-left"
          oninput="handleSearch(this.value)"
        />
        <svg class="w-3.5 h-3.5 text-slate-400 absolute left-3 top-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
      </div>

      <!-- OrbStack Indicator -->
      <div class="flex items-center space-x-2 px-3 py-1 bg-emerald-500/10 border border-emerald-500/20 rounded-full">
        <span class="w-2 h-2 rounded-full bg-emerald-400 dot-glow"></span>
        <span class="text-[11px] text-emerald-300 font-medium">OrbStack 就绪</span>
      </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="hidden px-5 py-2.5 bg-indigo-600/90 border-b border-indigo-400/30 text-white text-xs flex items-center justify-between shadow-lg transition-all animate-fade-in">
      <div class="flex items-center space-x-2">
        <span class="text-sm">✨</span>
        <span id="toastText">服务已启动！</span>
      </div>
      <button onclick="dismissToast()" class="text-indigo-200 hover:text-white">✕</button>
    </div>

    <!-- Launchpad App Icons Grid Area -->
    <div class="flex-1 p-8 overflow-y-auto">
      <div class="mb-3 px-2 flex items-center justify-between">
        <div class="text-[11px] font-medium tracking-wider uppercase text-slate-500">我的本地项目</div>
        <div class="text-[11px] text-slate-500">提示：左键点击直接启动进入，右键呼出管理菜单</div>
      </div>

      <!-- Grid of Apps (4 Columns) -->
      <div id="appsGrid" class="grid grid-cols-4 gap-y-7 gap-x-4 justify-items-center">
        <!-- Rendered by JS -->
      </div>
    </div>

    <!-- Bottom Status Bar -->
    <div class="h-10 bg-slate-850/60 border-t border-slate-850 px-6 flex items-center justify-between text-[11px] text-slate-500">
      <div class="flex items-center space-x-2">
        <span id="activeCount" class="text-emerald-400 font-medium">1 个项目运行中</span>
        <span>•</span>
        <span id="totalCount">共 4 个项目</span>
      </div>
      <div class="flex items-center space-x-3">
        <span>macOS Launchpad 交互体验</span>
      </div>
    </div>

  </div>

  <!-- macOS Style Context Menu -->
  <div id="contextMenu" class="hidden fixed z-50 w-48 bg-slate-800/95 border border-slate-700/80 rounded-xl shadow-2xl backdrop-blur-xl py-1 text-xs text-slate-200 divide-y divide-slate-700/50">
    <div class="px-3 py-1.5 text-[10px] uppercase font-semibold text-slate-400 tracking-wider" id="ctxProjectTitle">项目操作</div>
    <div class="py-1">
      <button onclick="ctxAction('open')" class="w-full px-3 py-1.5 text-left hover:bg-indigo-600 hover:text-white flex items-center space-x-2 transition-colors">
        <span>🌐</span>
        <span>打开前端网页</span>
      </button>
      <button onclick="ctxAction('launch')" class="w-full px-3 py-1.5 text-left hover:bg-indigo-600 hover:text-white flex items-center space-x-2 transition-colors">
        <span>🚀</span>
        <span>启动容器</span>
      </button>
      <button onclick="ctxAction('restart')" class="w-full px-3 py-1.5 text-left hover:bg-indigo-600 hover:text-white flex items-center space-x-2 transition-colors">
        <span>🔄</span>
        <span>重启容器</span>
      </button>
      <button onclick="ctxAction('stop')" class="w-full px-3 py-1.5 text-left hover:bg-red-600 hover:text-white flex items-center space-x-2 transition-colors text-red-400">
        <span>⏹</span>
        <span>停止容器</span>
      </button>
    </div>
    <div class="py-1">
      <button onclick="ctxAction('logs')" class="w-full px-3 py-1.5 text-left hover:bg-indigo-600 hover:text-white flex items-center space-x-2 transition-colors">
        <span>📋</span>
        <span>查看运行日志</span>
      </button>
      <button onclick="ctxAction('edit')" class="w-full px-3 py-1.5 text-left hover:bg-indigo-600 hover:text-white flex items-center space-x-2 transition-colors">
        <span>✏️</span>
        <span>修改地址 / 更换图标</span>
      </button>
    </div>
  </div>

  <script>
    const projects = [
      {
        id: 'hometown_vue',
        name: '家乡文旅系统',
        tech: 'Vue + SpringBoot',
        tag: 'Vue',
        bgGradient: 'from-emerald-500 to-teal-700',
        iconSvg: `<svg class="w-10 h-10 text-white" viewBox="0 0 24 24" fill="currentColor"><path d="M2 3h3.5L12 15 18.5 3H22L12 21 2 3zm4.5 0h3L12 8l2.5-5h3L12 13 6.5 3z"/></svg>`,
        frontendUrl: 'http://localhost:8081',
        port: '8081',
        status: 'stopped' // 'stopped', 'starting', 'running'
      },
      {
        id: '2025-blog-public',
        name: '个人博客 2025',
        tech: 'Next.js + Node',
        tag: 'Next',
        bgGradient: 'from-violet-600 to-indigo-800',
        iconSvg: `<svg class="w-10 h-10 text-white" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L1 21h22L12 2zm0 4.5l7.5 13h-15L12 6.5z"/></svg>`,
        frontendUrl: 'http://localhost:2025',
        port: '2025',
        status: 'stopped'
      },
      {
        id: 'web-ai-project02',
        name: 'TLIAS 智能管理',
        tech: 'JavaWeb + Vue',
        tag: 'Java',
        bgGradient: 'from-amber-500 to-orange-700',
        iconSvg: `<svg class="w-10 h-10 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8h1a4 4 0 010 8h-1M2 8h16v9a4 4 0 01-4 4H6a4 4 0 01-4-4V8zM6 1v3M10 1v3M14 1v3"/></svg>`,
        frontendUrl: 'http://localhost:90',
        port: '90',
        status: 'stopped'
      },
      {
        id: 'infs605-assignment2-main',
        name: '学生评教系统',
        tech: 'Python + Postgres',
        tag: 'Python',
        bgGradient: 'from-blue-500 to-cyan-700',
        iconSvg: `<svg class="w-10 h-10 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>`,
        frontendUrl: 'http://localhost:9090',
        port: '9090',
        status: 'running'
      }
    ];

    let currentFilter = '';
    let selectedProjectId = null;

    function renderApps() {
      const grid = document.getElementById('appsGrid');
      const filtered = projects.filter(p => 
        p.name.toLowerCase().includes(currentFilter.toLowerCase()) ||
        p.port.includes(currentFilter) ||
        p.tech.toLowerCase().includes(currentFilter.toLowerCase())
      );

      const runningCount = projects.filter(p => p.status === 'running').length;
      document.getElementById('activeCount').innerText = `${runningCount} 个项目运行中`;
      document.getElementById('totalCount').innerText = `共 ${projects.length} 个项目`;

      let html = filtered.map(p => {
        const isRunning = p.status === 'running';
        const isStarting = p.status === 'starting';

        return `
          <div 
            class="group flex flex-col items-center cursor-pointer w-28 select-none"
            onclick="handleAppClick('${p.id}')"
            oncontextmenu="handleContextMenu(event, '${p.id}')"
          >
            <!-- Squircle Icon Box -->
            <div class="relative w-20 h-20 mb-2 app-icon-press group-hover:scale-105 transition-all duration-200">
              
              <!-- Icon Background Squircle -->
              <div class="w-full h-full squircle bg-gradient-to-br ${p.bgGradient} flex items-center justify-center shadow-lg group-hover:shadow-indigo-500/25 ${isStarting ? 'launching-ring' : ''}">
                ${p.iconSvg}
              </div>

              <!-- Top-Right Port Badge -->
              <div class="absolute -top-1.5 -right-1.5 px-1.5 py-0.5 bg-slate-900/90 border border-slate-700 text-[10px] font-mono text-slate-300 rounded-md shadow-sm">
                :${p.port}
              </div>

              <!-- Starting Spinner Overlay -->
              ${isStarting ? `
                <div class="absolute inset-0 squircle bg-slate-950/70 flex flex-col items-center justify-center backdrop-blur-xs">
                  <svg class="animate-spin w-6 h-6 text-white" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                  </svg>
                  <span class="text-[9px] text-slate-200 mt-1 font-medium">就绪中</span>
                </div>
              ` : ''}

            </div>

            <!-- App Title -->
            <div class="text-xs font-medium text-slate-200 group-hover:text-white text-center truncate w-full px-1">
              ${p.name}
            </div>

            <!-- Running Dot Indicator (macOS Dock Style) -->
            <div class="h-2 flex items-center justify-center mt-1">
              ${isRunning ? `
                <div class="w-1.5 h-1.5 rounded-full bg-emerald-400 dot-glow"></div>
              ` : isStarting ? `
                <div class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></div>
              ` : `
                <div class="w-1.5 h-1.5 rounded-full bg-transparent"></div>
              `}
            </div>

          </div>
        `;
      }).join('');

      // Add "Import Project" Icon at the end
      html += `
        <div 
          class="group flex flex-col items-center cursor-pointer w-28 select-none"
          onclick="importProject()"
        >
          <div class="w-20 h-20 mb-2 squircle border-2 border-dashed border-slate-700 hover:border-indigo-500 bg-slate-800/40 hover:bg-slate-800/80 flex items-center justify-center group-hover:scale-105 transition-all">
            <svg class="w-8 h-8 text-slate-500 group-hover:text-indigo-400 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
            </svg>
          </div>
          <div class="text-xs font-medium text-slate-400 group-hover:text-indigo-300 text-center">
            导入新项目
          </div>
          <div class="h-2"></div>
        </div>
      `;

      grid.innerHTML = html;
    }

    function handleAppClick(id) {
      const p = projects.find(item => item.id === id);
      if (!p) return;

      if (p.status === 'running') {
        showToast(`🌐 [${p.name}] 正在运行，已自动在浏览器中打开: ${p.frontendUrl}`);
        window.open(p.frontendUrl, '_blank');
        return;
      }

      if (p.status === 'starting') {
        showToast(`⏳ [${p.name}] 正在启动与探活中，请稍候...`);
        return;
      }

      // Start project!
      p.status = 'starting';
      renderApps();
      showToast(`🚀 正在启动 [${p.name}] 容器并检测前端端口 :${p.port}...`);

      setTimeout(() => {
        p.status = 'running';
        renderApps();
        showToast(`🎉 [${p.name}] 服务就绪！已自动为您打开浏览器: ${p.frontendUrl}`);
        window.open(p.frontendUrl, '_blank');
      }, 1600);
    }

    function handleContextMenu(e, id) {
      e.preventDefault();
      selectedProjectId = id;
      const p = projects.find(item => item.id === id);
      if (!p) return;

      document.getElementById('ctxProjectTitle').innerText = p.name;
      const menu = document.getElementById('contextMenu');
      menu.style.left = `${e.clientX}px`;
      menu.style.top = `${e.clientY}px`;
      menu.classList.remove('hidden');
    }

    function hideContextMenu() {
      document.getElementById('contextMenu').classList.add('hidden');
    }

    function ctxAction(type) {
      const p = projects.find(item => item.id === selectedProjectId);
      if (!p) return;

      if (type === 'open') {
        window.open(p.frontendUrl, '_blank');
        showToast(`在浏览器中打开: ${p.frontendUrl}`);
      } else if (type === 'launch') {
        handleAppClick(p.id);
      } else if (type === 'restart') {
        p.status = 'starting';
        renderApps();
        showToast(`🔄 重启项目 [${p.name}]...`);
        setTimeout(() => {
          p.status = 'running';
          renderApps();
          showToast(`[${p.name}] 重启完毕并就绪`);
        }, 1500);
      } else if (type === 'stop') {
        p.status = 'stopped';
        renderApps();
        showToast(`⏹ 已停止项目 [${p.name}] 容器`);
      } else if (type === 'logs') {
        alert(`【模拟日志控制台 - ${p.name}】\n[INFO] Spring Boot started on port 8083\n[INFO] Vite dev server ready at http://localhost:${p.port}`);
      } else if (type === 'edit') {
        const newUrl = prompt(`修改 [${p.name}] 的前端打开地址:`, p.frontendUrl);
        if (newUrl) {
          p.frontendUrl = newUrl;
          showToast(`已更新前端地址为: ${newUrl}`);
        }
      }
      hideContextMenu();
    }

    function handleSearch(val) {
      currentFilter = val;
      renderApps();
    }

    function importProject() {
      alert('在完整应用中，将唤起 macOS 原生文件夹选择器，选择含 docker-compose.yml 的目录即可将其作为新应用图标加入！');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      const text = document.getElementById('toastText');
      text.innerText = msg;
      t.classList.remove('hidden');
    }

    function dismissToast() {
      document.getElementById('toast').classList.add('hidden');
    }

    // Initial render
    renderApps();
  </script>
</body>
</html>
